# Mosquitto MQTT Configuration for AgriSense-Edge
# Zero-Cloud Autonomous Edge Gateway

listener 1883 0.0.0.0
protocol mqtt

# Secure TLS Listener for Encrypted Sensor Communications
listener 8883 0.0.0.0
protocol mqtt
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Security: Allow anonymous connections in local edge subnet during initial commissioning,
# enforce password file for production deployment
allow_anonymous true
# password_file /mosquitto/config/passwd
